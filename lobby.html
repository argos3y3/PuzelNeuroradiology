<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby — Puzel</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');</style>
    <script>
        (function() {
            var auth = JSON.parse(sessionStorage.getItem('puzAuth') || 'null');
            if (!auth || auth.role !== 'admin') window.location.replace('login.html');
        })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f3ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #111827;
        }

        /* ── Header ── */
        .lob-header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }
        .lob-logo {
            width: 36px; height: 36px;
            background: #7c3aed; border-radius: 9px;
            color: white; font-size: 18px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .lob-title {
            font-size: 17px; font-weight: 700; color: #111827;
            flex: 1;
        }
        .lob-title span { color: #7c3aed; }
        .btn-cancel-lob {
            background: none; border: 1px solid #d1d5db;
            border-radius: 8px; padding: 7px 16px;
            font-size: 13px; font-weight: 600; color: #374151;
            cursor: pointer; font-family: 'Poppins', sans-serif;
            transition: background .12s;
        }
        .btn-cancel-lob:hover { background: #f9fafb; }

        /* ── Main content ── */
        .lob-main {
            flex: 1;
            padding: 28px 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 1080px;
            width: 100%;
            margin: 0 auto;
        }

        /* ── Sequence summary ── */
        .seq-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px 24px;
        }
        .seq-card-title {
            font-size: 12px; font-weight: 700; color: #9ca3af;
            letter-spacing: .7px; text-transform: uppercase;
            margin-bottom: 14px;
        }
        .seq-steps-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .seq-step-chip {
            display: flex; align-items: center; gap: 6px;
            background: #faf5ff; border: 1px solid #e9d5ff;
            border-radius: 20px; padding: 5px 12px;
            font-size: 12px; font-weight: 600; color: #374151;
        }
        .seq-step-chip-num {
            width: 18px; height: 18px;
            background: #7c3aed; color: white;
            border-radius: 50%; font-size: 10px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .seq-step-chip-badge {
            font-size: 10px; color: #9ca3af;
        }

        /* ── Users area ── */
        .users-area {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: start;
        }

        .user-panel {
            background: white;
            border: 1.5px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .user-panel.selected { border-color: #c084fc; }

        .user-panel-head {
            padding: 13px 18px;
            background: #f9fafb;
            border-bottom: 1px solid #f3f4f6;
            display: flex; align-items: center; justify-content: space-between;
        }
        .user-panel-head h3 {
            font-size: 13px; font-weight: 700; color: #374151;
        }
        .user-panel-badge {
            font-size: 11px; font-weight: 700;
            background: #7c3aed; color: white;
            border-radius: 10px; padding: 1px 9px;
        }

        .user-panel-body {
            min-height: 180px;
            max-height: 320px;
            overflow-y: auto;
        }

        .user-row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 18px;
            border-bottom: 1px solid #f9fafb;
            cursor: pointer;
            transition: background .1s;
            user-select: none;
        }
        .user-row:last-child { border-bottom: none; }
        .user-row:hover { background: #faf5ff; }
        .user-row.checked { background: #f3e8ff; }

        .user-row input[type=checkbox] {
            width: 16px; height: 16px;
            accent-color: #7c3aed; cursor: pointer; flex-shrink: 0;
        }
        .user-avatar {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-radius: 50%;
            color: white; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .user-name { font-size: 14px; font-weight: 600; flex: 1; }
        .user-online-dot {
            width: 8px; height: 8px;
            background: #22c55e; border-radius: 50%;
            flex-shrink: 0;
        }

        .user-sel-row {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 18px;
            border-bottom: 1px solid #f9fafb;
        }
        .user-sel-row:last-child { border-bottom: none; }
        .btn-remove-user {
            background: none; border: none;
            color: #9ca3af; font-size: 18px; cursor: pointer;
            line-height: 1; padding: 0; margin-left: auto;
            transition: color .1s;
        }
        .btn-remove-user:hover { color: #ef4444; }

        .user-empty {
            padding: 32px 18px;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            font-style: italic;
        }

        /* ── Transfer column ── */
        .transfer-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 60px;
            gap: 8px;
        }
        .btn-transfer {
            background: #7c3aed; color: white; border: none;
            border-radius: 10px; padding: 10px 18px;
            font-size: 13px; font-weight: 700; font-family: 'Poppins', sans-serif;
            cursor: pointer; transition: background .15s, opacity .15s;
            white-space: nowrap;
        }
        .btn-transfer:hover { background: #6d28d9; }
        .btn-transfer:disabled { opacity: .4; cursor: default; }

        /* ── Footer ── */
        .lob-footer {
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .lob-footer-info {
            font-size: 13px; color: #6b7280;
        }
        .btn-avvia {
            background: #22c55e; color: white; border: none;
            border-radius: 10px; padding: 12px 40px;
            font-size: 15px; font-weight: 700; font-family: 'Poppins', sans-serif;
            cursor: pointer; transition: background .15s, opacity .15s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-avvia:hover { background: #16a34a; }
        .btn-avvia:disabled { opacity: .4; cursor: default; }
        .btn-avvia:disabled:hover { background: #22c55e; }
    </style>
</head>
<body>

<!-- ── Header ── -->
<header class="lob-header">
    <div class="lob-logo">P</div>
    <div class="lob-title">Lobby — <span id="hdrSeqName">...</span></div>
    <button type="button" class="btn-cancel-lob" id="btnCancelLobby">← Annulla</button>
</header>

<!-- ── Main ── -->
<main class="lob-main">

    <!-- Sequence summary -->
    <div class="seq-card">
        <div class="seq-card-title">Riepilogo sequenza</div>
        <div class="seq-steps-list" id="seqStepsList"></div>
    </div>

    <!-- User lists -->
    <div class="users-area">

        <!-- Left: available users -->
        <div class="user-panel">
            <div class="user-panel-head">
                <h3>Utenti connessi</h3>
                <span class="user-panel-badge" id="availableBadge">0</span>
            </div>
            <div class="user-panel-body" id="availableList">
                <div class="user-empty">Nessun utente connesso.</div>
            </div>
        </div>

        <!-- Center: transfer button -->
        <div class="transfer-col">
            <button type="button" class="btn-transfer" id="btnInsert" disabled>
                Inserisci nella sequenza →
            </button>
        </div>

        <!-- Right: selected users -->
        <div class="user-panel selected">
            <div class="user-panel-head">
                <h3>Utenti selezionati</h3>
                <span class="user-panel-badge" id="selectedBadge">0</span>
            </div>
            <div class="user-panel-body" id="selectedList">
                <div class="user-empty">Nessun utente inserito.</div>
            </div>
        </div>

    </div>
</main>

<!-- ── Footer ── -->
<footer class="lob-footer">
    <span class="lob-footer-info" id="footerInfo">Seleziona almeno un utente per avviare la sequenza.</span>
    <button type="button" class="btn-avvia" id="btnAvvia" disabled>
        Avvia sequenza ›
    </button>
</footer>

<script type="module">
import { db } from './firebase-init.js';
import { collection, doc, getDocs, getDoc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';

const PRESENCE_TTL = 12000;
const DUMMY_USER   = 'utente dummy';

const params = new URLSearchParams(location.search);
const seqId  = params.get('seqId');
if (!seqId) { alert('Sequenza non trovata.'); window.location.href = 'home.html'; }

// ── Carica sequenza da Firestore ──────────────────────────────────────────
const seqDoc = await getDoc(doc(db, 'sequences', seqId));
if (!seqDoc.exists()) { alert('Sequenza non trovata.'); window.location.href = 'home.html'; }
const seq = seqDoc.data();

// ── Cache filesystem (lazy) ───────────────────────────────────────────────
let _fsCache = null;
async function getFileSystem() {
    if (_fsCache) return _fsCache;
    const snap = await getDocs(collection(db, 'filesystem'));
    _fsCache = {};
    snap.forEach(d => { _fsCache[d.id] = d.data().items || []; });
    return _fsCache;
}
async function getActivityById(id) {
    if (!id) return null;
    const fs = await getFileSystem();
    for (const fid in fs) {
        const found = (fs[fid] || []).find(item => item.id === id);
        if (found) return found;
    }
    return null;
}

// ── Stato ────────────────────────────────────────────────────────────────
let selectedUsers  = new Set();
let checkedUsers   = new Set();
let onlineUsers    = [];
let sessionStarted = false;

// ── Expand sequenza ───────────────────────────────────────────────────────
function expandSequence(s) {
    const ids = [];
    (s.steps || []).forEach(step => {
        const pool = (step.activities || []).map(a => a.id);
        if (!pool.length) return;
        if (step.randomize) ids.push(pool[Math.floor(Math.random() * pool.length)]);
        else                ids.push(...pool);
    });
    return ids;
}
const activityIds = expandSequence(seq);

// ── Scrivi lobby su Firestore ─────────────────────────────────────────────
async function writeLobby(extra) {
    const lobby = {
        seqId,
        seqName:       seq.name,
        steps:         seq.steps || [],
        activityIds,
        selectedUsers: [...selectedUsers],
        status:        'idle',
        currentIdx:    0,
        ...(extra || {})
    };
    await setDoc(doc(db, 'lobby', 'current'), lobby);
}

// ── Riepilogo sequenza ────────────────────────────────────────────────────
document.getElementById('hdrSeqName').textContent = seq.name;
const stepsListEl = document.getElementById('seqStepsList');
(seq.steps || []).forEach((step, i) => {
    const n    = (step.activities || []).length;
    const chip = document.createElement('div');
    chip.className = 'seq-step-chip';
    chip.innerHTML = `
        <span class="seq-step-chip-num">${i + 1}</span>
        <span>${step.activityType || '—'}</span>
        <span class="seq-step-chip-badge">${n} ist.</span>
    `;
    stepsListEl.appendChild(chip);
});

// ── Presenza da Firestore ─────────────────────────────────────────────────
async function getOnlineUsers() {
    const snap = await getDocs(collection(db, 'presence'));
    const now  = Date.now();
    const real = [];
    snap.forEach(d => {
        if (now - (d.data().ts || 0) < PRESENCE_TTL) real.push(d.id);
    });
    if (!real.includes(DUMMY_USER)) real.push(DUMMY_USER);
    return real.sort();
}

// ── Render liste ──────────────────────────────────────────────────────────
async function renderAvailableList() {
    onlineUsers = (await getOnlineUsers()).filter(u => !selectedUsers.has(u));
    const el    = document.getElementById('availableList');
    const badge = document.getElementById('availableBadge');
    badge.textContent = onlineUsers.length;
    checkedUsers.forEach(u => { if (!onlineUsers.includes(u)) checkedUsers.delete(u); });
    el.innerHTML = '';
    if (onlineUsers.length === 0) {
        el.innerHTML = '<div class="user-empty">Nessun utente connesso.</div>';
        updateTransferBtn();
        return;
    }
    onlineUsers.forEach(username => {
        const row = document.createElement('label');
        row.className = `user-row${checkedUsers.has(username) ? ' checked' : ''}`;
        row.innerHTML = `
            <input type="checkbox" ${checkedUsers.has(username) ? 'checked' : ''}>
            <div class="user-avatar">${username[0].toUpperCase()}</div>
            <span class="user-name">${username}</span>
            <span class="user-online-dot"></span>
        `;
        row.querySelector('input').addEventListener('change', e => {
            if (e.target.checked) checkedUsers.add(username);
            else                  checkedUsers.delete(username);
            row.classList.toggle('checked', e.target.checked);
            updateTransferBtn();
        });
        el.appendChild(row);
    });
    updateTransferBtn();
}

function renderSelectedList() {
    const el    = document.getElementById('selectedList');
    const badge = document.getElementById('selectedBadge');
    badge.textContent = selectedUsers.size;
    el.innerHTML = '';
    if (selectedUsers.size === 0) {
        el.innerHTML = '<div class="user-empty">Nessun utente inserito.</div>';
        updateAvviaBtn();
        return;
    }
    [...selectedUsers].forEach(username => {
        const row = document.createElement('div');
        row.className = 'user-sel-row';
        row.innerHTML = `
            <div class="user-avatar">${username[0].toUpperCase()}</div>
            <span class="user-name">${username}</span>
            <button type="button" class="btn-remove-user" title="Rimuovi">×</button>
        `;
        row.querySelector('.btn-remove-user').addEventListener('click', () => {
            selectedUsers.delete(username);
            writeLobby();
            renderAvailableList();
            renderSelectedList();
        });
        el.appendChild(row);
    });
    updateAvviaBtn();
}

function updateTransferBtn() {
    document.getElementById('btnInsert').disabled = checkedUsers.size === 0;
}

function updateAvviaBtn() {
    const btn  = document.getElementById('btnAvvia');
    const info = document.getElementById('footerInfo');
    const n    = selectedUsers.size;
    btn.disabled = n === 0;
    info.textContent = n === 0
        ? 'Seleziona almeno un utente per avviare la sequenza.'
        : `${n} utent${n === 1 ? 'e' : 'i'} in sequenza.`;
}

// ── Transfer ──────────────────────────────────────────────────────────────
document.getElementById('btnInsert').addEventListener('click', () => {
    checkedUsers.forEach(u => selectedUsers.add(u));
    checkedUsers.clear();
    writeLobby();
    renderAvailableList();
    renderSelectedList();
});

// ── Avvia ─────────────────────────────────────────────────────────────────
document.getElementById('btnAvvia').addEventListener('click', async () => {
    if (selectedUsers.size === 0 || activityIds.length === 0) return;
    const firstAct = await getActivityById(activityIds[0]);
    await writeLobby({
        status:              'pre-game',
        currentIdx:          0,
        currentActivityId:   activityIds[0],
        currentActivityName: firstAct?.name || activityIds[0],
        gameStartTime:       null,
        gameDuration:        null
    });
    sessionStarted = true;
    window.location.href = 'session.html';
});

// ── Cancel ────────────────────────────────────────────────────────────────
document.getElementById('btnCancelLobby').addEventListener('click', async () => {
    await deleteDoc(doc(db, 'lobby', 'current')).catch(() => {});
    window.location.href = 'home.html';
});

// ── Avvio ─────────────────────────────────────────────────────────────────
await writeLobby();
await renderAvailableList();
renderSelectedList();
const presenceInterval = setInterval(renderAvailableList, 3000);
window.addEventListener('beforeunload', () => {
    clearInterval(presenceInterval);
    if (!sessionStarted) deleteDoc(doc(db, 'lobby', 'current')).catch(() => {});
});
</script>
</body>
</html>
