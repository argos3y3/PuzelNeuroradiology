<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessione — Puzel</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');</style>
    <script>
        (function() {
            var auth = JSON.parse(sessionStorage.getItem('puzAuth') || 'null');
            if (!auth || auth.role !== 'admin') window.location.replace('login.html');
        })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f3ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #111827;
        }

        /* ── Header ── */
        .ses-header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 0 28px;
            height: 58px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        .ses-logo { width: 34px; height: 34px; background: #7c3aed; border-radius: 8px; color: white; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
        .ses-header-info { flex: 1; display: flex; flex-direction: column; }
        .ses-seq-name { font-size: 15px; font-weight: 700; color: #111827; }
        .ses-progress { font-size: 12px; color: #9ca3af; }
        .btn-exit-ses {
            background: none; border: 1px solid #fca5a5; border-radius: 8px;
            padding: 7px 14px; font-size: 13px; font-weight: 600; color: #ef4444;
            cursor: pointer; font-family: 'Poppins', sans-serif; transition: background .12s;
        }
        .btn-exit-ses:hover { background: #fef2f2; }

        /* ── Main ── */
        .ses-main {
            flex: 1;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        /* 3-column panel grid */
        .panel-grid {
            display: grid;
            grid-template-columns: 1.6fr 1fr 1fr;
            gap: 18px;
            align-items: start;
        }

        /* ── Generic panel card ── */
        .panel-card {
            background: white;
            border: 1.5px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
        }
        .panel-head {
            padding: 12px 18px;
            background: #f9fafb;
            border-bottom: 1px solid #f3f4f6;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            letter-spacing: .6px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-body { padding: 20px 18px; }

        /* ── Pre-game activity card ── */
        .act-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
        .act-step-badge {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            border-radius: 50%;
            color: white; font-size: 18px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .act-name { font-size: 20px; font-weight: 700; color: #111827; line-height: 1.3; }
        .act-type { font-size: 13px; color: #9ca3af; }
        .act-btn-group { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
        .btn-avvia-game {
            background: #7c3aed; color: white; border: none;
            border-radius: 10px; padding: 12px;
            font-size: 15px; font-weight: 700; font-family: 'Poppins', sans-serif;
            cursor: pointer; transition: background .15s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-avvia-game:hover { background: #6d28d9; }
        .btn-skip-act {
            background: none; border: 1px solid #d1d5db;
            border-radius: 10px; padding: 10px;
            font-size: 13px; font-weight: 600; color: #6b7280;
            font-family: 'Poppins', sans-serif; cursor: pointer; transition: background .12s;
        }
        .btn-skip-act:hover { background: #f9fafb; }

        /* ── Timer panel ── */
        .timer-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .timer-label { font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: #9ca3af; }
        .timer-display {
            font-size: 52px; font-weight: 700; color: #111827;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .timer-display.warning { color: #f59e0b; }
        .timer-display.expired { color: #ef4444; }
        .timer-act-name { font-size: 13px; color: #6b7280; text-align: center; }
        .timer-expired-badge {
            display: none;
            background: #fef2f2; border: 1px solid #fecaca;
            color: #ef4444; border-radius: 8px; padding: 8px 14px;
            font-size: 13px; font-weight: 700;
        }
        .timer-expired-badge.show { display: block; }

        /* ── Users / completion list ── */
        .user-comp-row {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #f3f4f6;
            font-size: 13px;
        }
        .user-comp-row:last-child { border-bottom: none; }
        .comp-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: #e9d5ff; color: #7c3aed;
            font-size: 12px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .comp-avatar.done { background: #dcfce7; color: #16a34a; }
        .comp-avatar.timeout { background: #fef3c7; color: #d97706; }
        .comp-name { flex: 1; font-weight: 600; color: #374151; }
        .comp-status { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
        .comp-status.win     { background: #dcfce7; color: #16a34a; }
        .comp-status.timeout { background: #fef3c7; color: #d97706; }
        .comp-status.pending { background: #f3f4f6; color: #9ca3af; }

        /* ── Stats panel placeholder ── */
        .stats-placeholder {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 120px; gap: 8px;
            color: #d1d5db;
        }
        .stats-placeholder svg { opacity: .4; }
        .stats-placeholder span { font-size: 13px; font-style: italic; }

        /* ── Footer (active state) ── */
        .ses-footer {
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .footer-status { font-size: 13px; color: #6b7280; }
        .btn-next-act {
            background: #22c55e; color: white; border: none;
            border-radius: 10px; padding: 11px 32px;
            font-size: 14px; font-weight: 700; font-family: 'Poppins', sans-serif;
            cursor: pointer; transition: background .15s;
        }
        .btn-next-act:hover { background: #16a34a; }
        .btn-next-act.last { background: #f59e0b; }
        .btn-next-act.last:hover { background: #d97706; }

        /* ── Complete screen ── */
        .complete-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 60vh; gap: 20px; text-align: center;
        }
        .complete-icon { font-size: 64px; }
        .complete-title { font-size: 28px; font-weight: 700; color: #111827; }
        .complete-subtitle { font-size: 14px; color: #6b7280; }
        .complete-actions { display: flex; gap: 12px; margin-top: 8px; }
        .btn-stats-review {
            background: #f3f4f6; border: 1px solid #d1d5db; color: #9ca3af;
            border-radius: 10px; padding: 11px 28px;
            font-size: 14px; font-weight: 600; font-family: 'Poppins', sans-serif;
            cursor: not-allowed;
        }
        .btn-exit-complete {
            background: #7c3aed; color: white; border: none;
            border-radius: 10px; padding: 11px 36px;
            font-size: 14px; font-weight: 700; font-family: 'Poppins', sans-serif;
            cursor: pointer; transition: background .15s;
        }
        .btn-exit-complete:hover { background: #6d28d9; }
    </style>
</head>
<body>

<!-- ── Header ── -->
<header class="ses-header">
    <div class="ses-logo">P</div>
    <div class="ses-header-info">
        <span class="ses-seq-name" id="sesSeqName">—</span>
        <span class="ses-progress" id="sesProgress"></span>
    </div>
    <button type="button" class="btn-exit-ses" id="btnExitSession">Esci dalla sequenza</button>
</header>

<!-- ── Main ── -->
<main class="ses-main" id="sesMain">

    <!-- PRE-GAME state -->
    <div id="statePreGame">
        <div class="panel-grid">
            <!-- Activity card -->
            <div class="panel-card">
                <div class="panel-head">Prossima attività</div>
                <div class="panel-body">
                    <div class="act-card">
                        <div class="act-step-badge" id="pgStepBadge">1</div>
                        <div class="act-name" id="pgActName">—</div>
                        <div class="act-type" id="pgActType"></div>
                        <div class="act-btn-group">
                            <button type="button" class="btn-avvia-game" id="btnAvviaGame">
                                &#9654; Avvia gioco
                            </button>
                            <button type="button" class="btn-skip-act" id="btnSkipAct">
                                Salta attività →
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Users -->
            <div class="panel-card">
                <div class="panel-head">Partecipanti</div>
                <div class="panel-body" id="pgUserList"></div>
            </div>

            <!-- Stats -->
            <div class="panel-card">
                <div class="panel-head">Statistiche</div>
                <div class="panel-body">
                    <div class="stats-placeholder">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="#9ca3af"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                        <span>Da popolare</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ACTIVE state -->
    <div id="stateActive" style="display:none;">
        <div class="panel-grid">
            <!-- Timer -->
            <div class="panel-card">
                <div class="panel-head">
                    <span>Timer</span>
                    <span id="activeActLabel" style="font-size:12px;color:#374151;text-transform:none;letter-spacing:0;font-weight:600;"></span>
                </div>
                <div class="panel-body">
                    <div class="timer-card">
                        <div class="timer-label">TEMPO RIMASTO</div>
                        <div class="timer-display" id="timerDisplay">--:--</div>
                        <div class="timer-expired-badge" id="timerExpiredBadge">⏰ TEMPO SCADUTO</div>
                    </div>
                </div>
            </div>

            <!-- User completions -->
            <div class="panel-card">
                <div class="panel-head">
                    <span>Partecipanti</span>
                    <span id="compSummary" style="font-size:11px;text-transform:none;letter-spacing:0;"></span>
                </div>
                <div class="panel-body" id="compList"></div>
            </div>

            <!-- Stats -->
            <div class="panel-card">
                <div class="panel-head">Statistiche</div>
                <div class="panel-body">
                    <div class="stats-placeholder">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="#9ca3af"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                        <span>Da popolare</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- COMPLETE state -->
    <div id="stateComplete" style="display:none;">
        <div class="complete-screen">
            <div class="complete-icon">🎉</div>
            <div class="complete-title">Sequenza ultimata!</div>
            <div class="complete-subtitle">Tutte le attività sono state completate.</div>
            <div class="complete-actions">
                <button type="button" class="btn-stats-review" disabled title="Funzionalità in arrivo">Revisiona statistiche</button>
                <button type="button" class="btn-exit-complete" id="btnExitComplete">Esci</button>
            </div>
        </div>
    </div>

</main>

<!-- ── Footer (active only) ── -->
<footer class="ses-footer" id="sesFooter" style="display:none;">
    <span class="footer-status" id="footerStatus"></span>
    <button type="button" class="btn-next-act" id="btnNextAct">Attività successiva →</button>
</footer>

<script type="module">
import { db } from './firebase-init.js';
import { collection, doc, getDocs, getDoc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';

// ── Carica lobby da Firestore ─────────────────────────────────────────────
const lobbySnap = await getDoc(doc(db, 'lobby', 'current'));
if (!lobbySnap.exists()) { window.location.href = 'home.html'; }
let lobby = lobbySnap.data();

let sessionTimerInterval = null;
let pollInterval         = null;
let userStatuses         = {};  // username → { activityId, status }

// ── Cache filesystem ──────────────────────────────────────────────────────
let _fsCache = null;
async function getFileSystem() {
    if (_fsCache) return _fsCache;
    const snap = await getDocs(collection(db, 'filesystem'));
    _fsCache = {};
    snap.forEach(d => { _fsCache[d.id] = d.data().items || []; });
    return _fsCache;
}
async function getActivityById(id) {
    if (!id) return null;
    const fs = await getFileSystem();
    for (const fid in fs) {
        const found = (fs[fid] || []).find(item => item.id === id);
        if (found) return found;
    }
    return null;
}

// ── Scrivi lobby su Firestore ─────────────────────────────────────────────
async function writeLobby(updates) {
    lobby = { ...lobby, ...updates, updatedAt: Date.now() };
    await setDoc(doc(db, 'lobby', 'current'), lobby);
}

// ── Stato utenti (in-memory, aggiornato dal poll) ─────────────────────────
function getUserStatus(username) {
    const s = userStatuses[username];
    if (!s || s.activityId !== lobby.currentActivityId) return null;
    return s.status;
}

async function pollUserStatuses() {
    const snap = await getDocs(collection(db, 'userStatus'));
    snap.forEach(d => { userStatuses[d.id] = d.data(); });
    renderCompletions();
}

// ── Render ────────────────────────────────────────────────────────────────
function renderAll() {
    const status = lobby.status;
    document.getElementById('statePreGame').style.display  = status === 'pre-game' ? '' : 'none';
    document.getElementById('stateActive').style.display   = status === 'active'   ? '' : 'none';
    document.getElementById('stateComplete').style.display = status === 'complete'  ? '' : 'none';
    document.getElementById('sesFooter').style.display     = status === 'active'    ? '' : 'none';

    const idx   = lobby.currentIdx || 0;
    const total = (lobby.activityIds || []).length;
    document.getElementById('sesSeqName').textContent = lobby.seqName || '—';
    document.getElementById('sesProgress').textContent =
        status === 'complete' ? 'Completata' : `Attività ${idx + 1} di ${total}`;

    if (status === 'pre-game') renderPreGame(idx);
    if (status === 'active')   renderActive(idx, total);
}

// ── Pre-game ──────────────────────────────────────────────────────────────
async function renderPreGame(idx) {
    clearInterval(sessionTimerInterval);
    clearInterval(pollInterval);

    const act = await getActivityById(lobby.currentActivityId);
    document.getElementById('pgStepBadge').textContent = idx + 1;
    document.getElementById('pgActName').textContent   = lobby.currentActivityName || act?.name || '—';
    document.getElementById('pgActType').textContent   = act?.activityType || '';

    const ul = document.getElementById('pgUserList');
    ul.innerHTML = '';
    (lobby.selectedUsers || []).forEach(u => {
        const row = document.createElement('div');
        row.className = 'user-comp-row';
        row.innerHTML = `<div class="comp-avatar">${u[0].toUpperCase()}</div><span class="comp-name">${u}</span>`;
        ul.appendChild(row);
    });
}

// ── Active ────────────────────────────────────────────────────────────────
function renderActive(idx, total) {
    const isLast = idx >= total - 1;
    const btn = document.getElementById('btnNextAct');
    btn.textContent = isLast ? 'Termina sequenza' : 'Attività successiva →';
    btn.className   = 'btn-next-act' + (isLast ? ' last' : '');
    document.getElementById('activeActLabel').textContent = lobby.currentActivityName || '';
    startSessionTimer();
    renderCompletions();
    clearInterval(pollInterval);
    pollInterval = setInterval(pollUserStatuses, 2000);
}

function renderCompletions() {
    const container = document.getElementById('compList');
    const users     = lobby.selectedUsers || [];
    const doneCount = users.filter(u => getUserStatus(u)).length;
    document.getElementById('compSummary').textContent = `${doneCount}/${users.length} completati`;
    container.innerHTML = '';
    users.forEach(u => {
        const s   = getUserStatus(u);
        const row = document.createElement('div');
        row.className = 'user-comp-row';
        const avatarCls   = s === 'win' ? 'done' : s === 'timeout' ? 'timeout' : '';
        const icon        = s === 'win' ? '✓' : s === 'timeout' ? '⏰' : u[0].toUpperCase();
        const statusLabel = s === 'win' ? 'Completato' : s === 'timeout' ? 'Tempo sc.' : 'In corso...';
        const statusCls   = s === 'win' ? 'win' : s === 'timeout' ? 'timeout' : 'pending';
        row.innerHTML = `
            <div class="comp-avatar ${avatarCls}">${icon}</div>
            <span class="comp-name">${u}</span>
            <span class="comp-status ${statusCls}">${statusLabel}</span>
        `;
        container.appendChild(row);
    });
    const pending = users.filter(u => !getUserStatus(u)).length;
    document.getElementById('footerStatus').textContent =
        pending === 0 ? 'Tutti hanno completato il gioco.' : `${pending} utent${pending === 1 ? 'e' : 'i'} ancora in gioco.`;
}

// ── Timer ─────────────────────────────────────────────────────────────────
function startSessionTimer() {
    clearInterval(sessionTimerInterval);
    const dur     = lobby.gameDuration || 300;
    const display = document.getElementById('timerDisplay');
    const badge   = document.getElementById('timerExpiredBadge');
    badge.classList.remove('show');
    display.classList.remove('warning', 'expired');
    function tick() {
        if (!lobby.gameStartTime) return;
        const elapsed   = Math.floor((Date.now() - lobby.gameStartTime) / 1000);
        const remaining = Math.max(0, dur - elapsed);
        const m = Math.floor(remaining / 60).toString().padStart(2, '0');
        const s = (remaining % 60).toString().padStart(2, '0');
        display.textContent = `${m}:${s}`;
        if (remaining === 0) { clearInterval(sessionTimerInterval); display.classList.add('expired'); badge.classList.add('show'); }
        else if (remaining <= 30) display.classList.add('warning');
    }
    tick();
    sessionTimerInterval = setInterval(tick, 1000);
}

// ── Avvia gioco ───────────────────────────────────────────────────────────
document.getElementById('btnAvviaGame').addEventListener('click', async () => {
    const act = await getActivityById(lobby.currentActivityId);
    const dur = (act?.timerMinutes || 5) * 60;
    await writeLobby({ status: 'active', gameStartTime: Date.now(), gameDuration: dur });
    renderAll();
});

// ── Skip / Next ───────────────────────────────────────────────────────────
document.getElementById('btnSkipAct').addEventListener('click', () => advanceActivity(true));
document.getElementById('btnNextAct').addEventListener('click', () => advanceActivity(false));

async function advanceActivity(skipCheck) {
    if (!skipCheck) {
        const pending = (lobby.selectedUsers || []).filter(u => !getUserStatus(u));
        if (pending.length > 0) {
            const ok = confirm(`Attenzione: ${pending.join(', ')} non ha ancora terminato il gioco.\nPassare all'attività successiva?`);
            if (!ok) return;
        }
    }
    clearInterval(sessionTimerInterval);
    clearInterval(pollInterval);
    const nextIdx = (lobby.currentIdx || 0) + 1;
    const ids     = lobby.activityIds || [];
    if (nextIdx >= ids.length) {
        await writeLobby({ status: 'complete' });
    } else {
        const nextAct = await getActivityById(ids[nextIdx]);
        await writeLobby({
            status:              'pre-game',
            currentIdx:          nextIdx,
            currentActivityId:   ids[nextIdx],
            currentActivityName: nextAct?.name || ids[nextIdx],
            gameStartTime:       null,
            gameDuration:        null
        });
    }
    renderAll();
}

// ── Exit ──────────────────────────────────────────────────────────────────
async function exitSession() {
    clearInterval(sessionTimerInterval);
    clearInterval(pollInterval);
    await deleteDoc(doc(db, 'lobby', 'current')).catch(() => {});
    window.location.href = 'home.html';
}

document.getElementById('btnExitSession').addEventListener('click', async () => {
    if (confirm('Uscire dalla sequenza? Gli utenti verranno rimandati alla schermata di attesa.')) {
        await exitSession();
    }
});
document.getElementById('btnExitComplete').addEventListener('click', exitSession);

// ── Init ─────────────────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
