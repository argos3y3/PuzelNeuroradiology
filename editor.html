<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Editor</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            var auth = JSON.parse(sessionStorage.getItem('puzAuth') || 'null');
            if (!auth || auth.role !== 'admin') window.location.replace('login.html');
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body { background-color: #f9f9f9; padding: 30px; }
        .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .btn-save { background: #ec4899; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-back { background: #ccc; color: black; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
        
        .settings-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px; }
        .zone-checks { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 0; }
        .zone-checks label { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .zone-checks input[type="checkbox"] { padding: 0; width: 16px; height: 16px; accent-color: #ec4899; cursor: pointer; }
        .input-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Poppins'; background: white; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .input-group input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Poppins'; }
        
        .items-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-row { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; padding: 15px; border: 1px solid #eee; border-radius: 8px; background: #fafafa; }
        .item-row input[type="text"] { flex: 2; padding: 10px; border: 1px solid #ccc; border-radius: 4px; text-transform: uppercase;}
        .item-row input[type="file"] { flex: 1; }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; display: none; }
        .btn-remove { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .btn-add { background: #000; color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .intruso-label { display: flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; cursor: pointer; }
        .intruso-label input[type="checkbox"] { width: 16px; height: 16px; accent-color: #9333ea; cursor: pointer; }

        /* Quiz (radiazione a catena) */
        .question-block { flex-direction: column; gap: 10px; }
        .qb-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .qb-header strong { font-size: 14px; color: #6b7280; }
        .q-text { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Poppins'; font-size: 14px; resize: vertical; min-height: 60px; box-sizing: border-box; }
        .qb-answers { display: flex; flex-direction: column; gap: 6px; }
        .qa-row { display: flex; align-items: center; gap: 8px; }
        .qa-label { width: 24px; height: 24px; background: #374151; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        .qa-input { flex: 1; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Poppins'; font-size: 13px; }
        .qa-correct-label { display: flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .qa-correct-label input[type="radio"] { accent-color: #22c55e; cursor: pointer; }
        .qa-remove { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 18px; padding: 0 4px; line-height: 1; }
        .btn-add-answer { background: #f3f4f6; color: #374151; border: 1px dashed #9ca3af; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%; font-family: 'Poppins'; }
        .qb-image-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid #f3f4f6; padding-top: 10px; font-size: 12px; color: #6b7280; }

        /* GUESS WHAT: editor */
        .gw-editor-img-area { background: #f3f4f6; border: 2px dashed #d1d5db; border-radius: 8px; min-height: 80px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; padding: 16px; margin-bottom: 16px; cursor: pointer; transition: border-color 0.15s; }
        .gw-editor-img-area:hover { border-color: #7c3aed; }
        .gw-editor-img-area input[type="file"] { display: none; }
        .gw-editor-img-placeholder { font-size: 13px; color: #9ca3af; text-align: center; }
        .gw-label-row { display: flex; align-items: center; gap: 10px; }
        .gw-label-num-badge { width: 24px; height: 24px; background: #7c3aed; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; flex-shrink: 0; }
        .gw-place-btn { background: white; border: 1.5px solid #d1d5db; border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
        .gw-place-btn:hover { border-color: #7c3aed; background: #f3e8ff; }
        .gw-place-btn.gw-placing { background: #7c3aed; border-color: #7c3aed; color: white; }
        .gw-place-btn.gw-placed { border-color: #22c55e; color: #166534; background: #dcfce7; }
        /* Preview area for gw */
        .gw-preview-wrap { position: relative; display: inline-block; border-radius: 8px; overflow: hidden; }
        .gw-preview-img { display: block; max-width: 100%; border-radius: 8px; }
        .gw-preview-img.gw-placing-mode { cursor: crosshair; touch-action: none; }
        .gw-preview-pin { position: absolute; transform: translate(-50%, -50%); width: 24px; height: 24px; background: #7c3aed; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.35); cursor: move; user-select: none; touch-action: none; z-index: 10; }
        .gw-preview-pin.gw-pin-placing { background: #ec4899; animation: gwPulse 0.8s ease-in-out infinite alternate; }
        @keyframes gwPulse { from { box-shadow: 0 0 0 2px rgba(236,72,153,0.4); } to { box-shadow: 0 0 0 8px rgba(236,72,153,0); } }
        .gw-placing-hint { font-size: 12px; color: #ec4899; font-weight: 600; margin-top: 8px; text-align: center; min-height: 18px; }

        /* PASSA E SPASSA: editor chips */
        .pps-chips-label { font-size: 11px; color: #6b7280; letter-spacing: 0.5px; margin: 10px 0 6px; font-weight: 600; text-transform: uppercase; }
        .pps-chips-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 34px; padding: 6px; background: #f9f9f9; border-radius: 6px; border: 1px dashed #e5e7eb; }
        .pps-editor-chip { background: white; border: 1.5px solid #d1d5db; border-radius: 20px; padding: 4px 12px; font-size: 13px; cursor: pointer; transition: all 0.15s; color: #374151; font-family: 'Poppins', sans-serif; }
        .pps-editor-chip:hover { border-color: #ec4899; color: #ec4899; }
        .pps-editor-chip.selected { background: #ec4899; border-color: #ec4899; color: white; }

        /* SE CONOSCI: anteprima in tempo reale */
        .scr-editor-body { display: flex; gap: 24px; align-items: flex-start; }
        .scr-editor-form { flex: 1; min-width: 0; }
        .scr-editor-preview { width: 400px; flex-shrink: 0; position: sticky; top: 30px; }
        .scr-preview-label { font-size: 10px; font-weight: bold; letter-spacing: 2px; color: #6b7280; text-transform: uppercase; margin-bottom: 10px; }
        .scr-preview-wrap { background: black; padding: 16px; border-radius: 8px; overflow: auto; min-height: 80px; }
        .prv-grid { display: grid; gap: 2px; }
        .prv-cell { background: white; position: relative; width: 22px; height: 22px; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: #222; text-transform: uppercase; }
        .prv-cell.prv-start { background-color: #f9a8d4; }
        .prv-cell.prv-hidden { background-color: #fbcfe8; }
        .prv-cell.prv-start.prv-hidden { background-color: #f9a8d4; }
        .prv-num { position: absolute; top: 0; left: 1px; font-size: 6px; font-weight: bold; color: #555; pointer-events: none; line-height: 1; }
        .prv-cell.prv-invalid { outline: 2px solid #dc2626; outline-offset: -2px; }
        .scr-preview-empty { color: #888; font-size: 13px; padding: 30px 20px; text-align: center; margin: 0; }
        .scr-preview-warning { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 6px; padding: 10px 12px; font-size: 12px; line-height: 1.5; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="editor-header">
        <div>
            <h1 id="editorTitle">Crea Attività</h1>
            <p>Aggiungi le parole e le immagini per il tuo gioco.</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <a href="index.html" class="btn-back">Annulla</a>
            <button type="button" class="btn-save" id="btnSave">Salva Attività</button>
        </div>
    </div>

    <div class="settings-panel">
        <div class="input-group">
            <label>Nome Attività</label>
            <input type="text" id="activityName" placeholder="Es. Anatomia Umana">
        </div>
        <div class="input-group" style="flex: 0.3;">
            <label>Timer (Minuti)</label>
            <input type="number" id="activityTimer" value="5" min="0" max="60">
        </div>
        <div class="input-group" style="flex: 0.3;">
            <label>Timer (Secondi)</label>
            <input type="number" id="activityTimerSeconds" value="0" min="0" max="59">
        </div>
        <div style="flex-basis: 100%; height: 0;"></div>
        <div class="input-group" style="flex: 3 1 420px;">
            <label>Zona del corpo (una o più)</label>
            <div class="zone-checks" id="zoneChecks">
                <label><input type="checkbox" value="CTV"> CTV – cardio toracovascolare</label>
                <label><input type="checkbox" value="SN"> SN – sistema nervoso</label>
                <label><input type="checkbox" value="AP"> AP – addome pelvi</label>
                <label><input type="checkbox" value="MS"> MS – muscolo scheletrico</label>
                <label><input type="checkbox" value="TC"> TC – testa collo</label>
            </div>
        </div>
        <div class="input-group" style="flex: 0.5 1 140px;">
            <label>Difficoltà</label>
            <select id="activityDifficulty">
                <option value="">— scegli —</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>
    </div>

    <div class="items-panel">
        <h3 id="itemsPanelTitle">Contenuto (Parole e Immagini)</h3>
        <div id="itemsContainer"></div>
        <button type="button" class="btn-add" id="btnAddItem">+ Aggiungi Parola</button>
    </div>

    <script type="module">
        import { db } from './firebase-init.js';
        import { collection, doc, getDoc, getDocs, setDoc, runTransaction } from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';

        // Copy of selected activities for the 'agente' role: never an activity's home folder
        const AGENTE_FOLDER_ID = 'agente_selezione';
        const ZONES = ['CTV', 'SN', 'AP', 'MS', 'TC'];

        const urlParams = new URLSearchParams(window.location.search);
        const editId    = urlParams.get('id'); // present when editing an existing activity

        // Solo la struttura cartelle + l'attività in modifica: scaricare tutte le attività con immagini blocca la pagina
        const _fs = {};
        {
            const [_fsSnap, _actSnap] = await Promise.all([
                getDocs(collection(db, 'filesystem')),
                editId ? getDoc(doc(db, 'activities', editId)) : null
            ]);
            const _full = _actSnap?.exists() ? { ..._actSnap.data(), id: editId } : null;
            _fsSnap.forEach(d => {
                _fs[d.id] = (d.data().items || []).map(item =>
                    (_full && item.id === editId) ? _full : item
                );
            });
            if (!_fs.root) _fs.root = [];
        }

        function _findFolderForActivity(actId) {
            for (const fid in _fs) {
                if (fid === AGENTE_FOLDER_ID) continue;
                if ((_fs[fid] || []).some(item => item.id === actId)) return fid;
            }
            return 'root';
        }

        const editFolderId    = editId ? _findFolderForActivity(editId) : null;
        const editData        = editId
            ? (_fs[editFolderId] || []).find(a => a.id === editId) || null
            : null;

        const activityTypeKey = urlParams.get('type') || editData?.templateKey || '';
        const folderId        = urlParams.get('folder') || editFolderId || 'root';

        const isTrovaIntruso  = activityTypeKey === 'trova-intruso';
        const isRadiazione    = activityTypeKey === 'radiazione-a-catena';
        const isSeConosci     = activityTypeKey === 'se-conosci-riconosci';
        const isPassaESpassa  = activityTypeKey === 'passa-e-spassa';
        const isGuessWhat     = activityTypeKey === 'guess-what';

        const TITLES = {
            'crossword':                'Crea Crucitomo',
            'hangman':                  'Crea Il tempo è tiranno',
            'trova-intruso':            "Crea Trova l'Intruso",
            'radiazione-a-catena':      'Crea Radiazione a Catena',
            'se-conosci-riconosci':     'Crea Se Conosci...Riconosci',
            'passa-e-spassa':           'Crea Passa e Spassa',
            'guess-what':               'Crea Guess What'
        };
        const EDIT_TITLES = {
            'crossword':                'Modifica Crucitomo',
            'hangman':                  'Modifica Il tempo è tiranno',
            'trova-intruso':            "Modifica Trova l'Intruso",
            'radiazione-a-catena':      'Modifica Radiazione a Catena',
            'se-conosci-riconosci':     'Modifica Se Conosci...Riconosci',
            'passa-e-spassa':           'Modifica Passa e Spassa',
            'guess-what':               'Modifica Guess What'
        };
        const ACTIVITY_NAMES = {
            'crossword':                'Crucitomo',
            'hangman':                  'Il tempo è tiranno',
            'trova-intruso':            "Trova l'Intruso",
            'radiazione-a-catena':      'Radiazione a Catena',
            'se-conosci-riconosci':     'Se Conosci...Riconosci',
            'passa-e-spassa':           'Passa e Spassa',
            'guess-what':               'Guess What'
        };

        document.getElementById('editorTitle').innerText = editId
            ? (EDIT_TITLES[activityTypeKey] || 'Modifica Attività')
            : (TITLES[activityTypeKey] || 'Crea Attività');
        if (editId) document.getElementById('btnSave').textContent = 'Aggiorna Attività';

        if (isTrovaIntruso) {
            document.getElementById('itemsPanelTitle').innerText = 'Immagini';
            document.getElementById('btnAddItem').innerText = '+ Aggiungi Immagine';
        }
        if (isRadiazione) {
            document.getElementById('itemsPanelTitle').innerText = 'Domande';
            document.getElementById('btnAddItem').innerText = '+ Aggiungi Domanda';
        }
        if (isPassaESpassa) {
            document.getElementById('itemsPanelTitle').innerText = 'Frasi';
            document.getElementById('btnAddItem').innerText = '+ Aggiungi Frase';
        }
        if (isGuessWhat) {
            document.getElementById('itemsPanelTitle').innerText = 'Etichette';
            document.getElementById('btnAddItem').innerText = '+ Aggiungi Etichetta';
        }

        const itemsContainer = document.getElementById('itemsContainer');
        const btnAddItem = document.getElementById('btnAddItem');
        const btnSave = document.getElementById('btnSave');

        function attachFilePreview(row) {
            const fileInput = row.querySelector('.file-input');
            const imgPreview = row.querySelector('.img-preview');
            if (!fileInput || !imgPreview) return;
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (imgPreview._blobUrl) URL.revokeObjectURL(imgPreview._blobUrl);
                const blobUrl = URL.createObjectURL(file);
                imgPreview._blobUrl = blobUrl;
                imgPreview._file = file;
                imgPreview.src = blobUrl;
                imgPreview.style.display = 'block';
            });
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (ev) => resolve(ev.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function compressBase64Image(src, maxWidth = 800, quality = 0.75) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(src);
                img.src = src;
            });
        }

        async function readAndCompressImage(file) {
            const raw = await readFileAsBase64(file);
            return compressBase64Image(raw);
        }

        // --- RADIAZIONE: aggiungi riga risposta dentro un blocco-domanda ---
        const ansLabels = ['A','B','C','D','E','F'];

        function addAnswerRow(answersContainer, groupName, idx) {
            const aRow = document.createElement('div');
            aRow.className = 'qa-row';
            aRow.innerHTML = `
                <span class="qa-label">${ansLabels[idx]}</span>
                <input type="text" class="qa-input" placeholder="Risposta ${ansLabels[idx]}...">
                <label class="qa-correct-label">
                    <input type="radio" name="${groupName}" class="qa-correct"> Corretta
                </label>
                <button type="button" class="qa-remove" title="Rimuovi risposta">×</button>
            `;
            aRow.querySelector('.qa-remove').addEventListener('click', (e) => {
                e.preventDefault();
                const allRows = answersContainer.querySelectorAll('.qa-row');
                if (allRows.length > 2) {
                    aRow.remove();
                    // ri-etichetta
                    answersContainer.querySelectorAll('.qa-row').forEach((r, i) => {
                        r.querySelector('.qa-label').textContent = ansLabels[i];
                        r.querySelector('.qa-input').placeholder = `Risposta ${ansLabels[i]}...`;
                    });
                }
            });
            answersContainer.appendChild(aRow);
        }

        function createItemRow() {
            const row = document.createElement('div');
            row.className = 'item-row';

            if (isRadiazione) {
                row.classList.add('question-block');
                const groupName = 'correct_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                row.dataset.group = groupName;

                row.innerHTML = `
                    <div class="qb-header">
                        <strong>Domanda</strong>
                        <button type="button" class="btn-remove">Elimina domanda</button>
                    </div>
                    <textarea class="q-text" placeholder="Testo della domanda..."></textarea>
                    <div class="qb-answers"></div>
                    <button type="button" class="btn-add-answer">+ Aggiungi risposta</button>
                    <div class="qb-image-row">
                        <span>Immagine (opzionale):</span>
                        <input type="file" accept="image/png, image/jpeg" class="file-input">
                        <img src="" class="img-preview" style="width:60px;height:60px;object-fit:cover;border-radius:4px;border:1px solid #ddd;display:none;">
                    </div>
                `;

                const answersContainer = row.querySelector('.qb-answers');
                for (let i = 0; i < 4; i++) addAnswerRow(answersContainer, groupName, i);

                row.querySelector('.btn-add-answer').addEventListener('click', (e) => {
                    e.preventDefault();
                    const count = answersContainer.querySelectorAll('.qa-row').length;
                    if (count < 6) addAnswerRow(answersContainer, groupName, count);
                });

                attachFilePreview(row);

            } else if (isGuessWhat) {
                row.classList.add('gw-label-row');
                const labelIdx = gwPinPositions.length;
                gwPinPositions.push(null);
                row.dataset.gwIdx = labelIdx;

                row.innerHTML = `
                    <span class="gw-label-num-badge">${labelIdx + 1}</span>
                    <input type="text" placeholder="Nome struttura..." class="word-input gw-name-input" style="flex:1;">
                    <button type="button" class="gw-place-btn" title="Clicca per posizionare sull'immagine">📌 Posiziona</button>
                    <button type="button" class="btn-remove" style="flex-shrink:0;">×</button>
                `;

                row.querySelector('.gw-place-btn').addEventListener('click', () => {
                    if (typeof gwStartPlacing === 'function') gwStartPlacing(parseInt(row.dataset.gwIdx));
                });

                row.querySelector('.btn-remove').addEventListener('click', (e) => {
                    e.preventDefault();
                    const idx = parseInt(row.dataset.gwIdx);
                    gwPinPositions.splice(idx, 1);
                    row.remove();
                    if (typeof gwRenumberRows === 'function') gwRenumberRows();
                    if (typeof gwRenderPreviewPins === 'function') gwRenderPreviewPins();
                });

            } else if (isPassaESpassa) {
                row.classList.add('question-block', 'pps-phrase-block');
                const phraseCount = itemsContainer.querySelectorAll('.pps-phrase-block').length + 1;
                row.innerHTML = `
                    <div class="qb-header">
                        <strong>Frase ${phraseCount}</strong>
                        <button type="button" class="btn-remove">Elimina frase</button>
                    </div>
                    <label style="font-size:12px;color:#6b7280;margin-bottom:4px;display:block;">FRASE</label>
                    <textarea class="pps-text-input q-text" placeholder="Scrivi la frase completa qui..."></textarea>
                    <div class="pps-chips-label">SPAZI VUOTI — clicca le parole per nasconderle</div>
                    <div class="pps-chips-container"></div>
                    <label style="font-size:12px;color:#6b7280;margin:8px 0 4px;display:block;">INSTRUCTION (opzionale)</label>
                    <textarea class="pps-instruction q-text" placeholder="Istruzione per lo studente..." style="min-height:44px;"></textarea>
                    <div class="qb-image-row" style="margin-top:8px;">
                        <span>Immagine (opzionale):</span>
                        <input type="file" accept="image/png, image/jpeg" class="file-input">
                        <img src="" class="img-preview" style="width:60px;height:60px;object-fit:cover;border-radius:4px;border:1px solid #ddd;display:none;">
                    </div>
                `;

                const textarea    = row.querySelector('.pps-text-input');
                const chipsDiv    = row.querySelector('.pps-chips-container');
                const selectedBlanks = new Set();  // selected token indices

                function rebuildChips() {
                    const tokens = textarea.value.trim().split(/\s+/).filter(t => t.length > 0);
                    chipsDiv.innerHTML = '';
                    tokens.forEach((token, idx) => {
                        const chip = document.createElement('button');
                        chip.type = 'button';
                        chip.className = 'pps-editor-chip' + (selectedBlanks.has(idx) ? ' selected' : '');
                        chip.textContent = token;
                        chip.addEventListener('click', () => {

        // ── GUESS WHAT: image upload + interactive pin placement ─────────────

            // ── Render/refresh all pins in the preview ─────────────────

                        if (gwPlacingIdx === null) return;
                        const rect = gwPreviewImg.getBoundingClientRect();
                        const x = ((e.clientX - rect.left) / rect.width)  * 100;
                        const y = ((e.clientY - rect.top)  / rect.height) * 100;
                        gwPinPositions[gwPlacingIdx] = { x, y };

            // ── Make a pin draggable to reposition ─────────────────────
            function gwMakePinDraggable(pin, idx) {
                let dragging = false, startX, startY, origX, origY;

                pin.addEventListener('pointerdown', (e) => {
                    if (gwPlacingIdx !== null) return;
                    e.preventDefault();
                    dragging = true;
                    pin.setPointerCapture(e.pointerId);
                    startX = e.clientX; startY = e.clientY;
                    origX  = gwPinPositions[idx].x;
                    origY  = gwPinPositions[idx].y;
                });
                pin.addEventListener('pointermove', (e) => {
                    if (!dragging) return;
                    const rect = gwPreviewImg.getBoundingClientRect();
                    const dx = (e.clientX - startX) / rect.width  * 100;
                    const dy = (e.clientY - startY) / rect.height * 100;
                    gwPinPositions[idx] = {
                        x: Math.max(0, Math.min(100, origX + dx)),
                        y: Math.max(0, Math.min(100, origY + dy))
                    };
                    pin.style.left = gwPinPositions[idx].x + '%';
                    pin.style.top  = gwPinPositions[idx].y + '%';
                });
                pin.addEventListener('pointerup', () => { dragging = false; });
            }

        // ─────────────────────────────────────────────────────────────────────

        function renderPreview() {
            const prvWrap    = document.getElementById('prvWrap');
            const prvWarning = document.getElementById('prvWarning');
            if (!prvWrap) return;

            const words = [];
            document.querySelectorAll('.word-input').forEach(inp => {
                const w = inp.value.trim().toUpperCase().replace(/\s/g, '');
                if (w.length > 1) words.push(w);
            });

            if (words.length === 0) {
                prvWrap.innerHTML = '<p class="scr-preview-empty">Aggiungi parole per vedere l\'anteprima</p>';
                if (prvWarning) prvWarning.hidden = true;
                return;
            }

            // The intersection letter for each word is found automatically from the
            // hidden solution word typed by the teacher (same logic used in-game).
            const hiddenSol = (document.getElementById('hiddenSolutionInput')?.value || '')
                              .toUpperCase().replace(/\s/g, '');
            const notFoundRows = [];
            const hiddenPos = words.map((text, i) => {
                const ch = hiddenSol[i] || '';
                const f  = ch ? text.indexOf(ch) : -1;
                if (f < 0) notFoundRows.push(i);
                return f >= 0 ? f : 0;
            });

            // Warn when the hidden solution doesn't line up 1:1 with the words
            if (prvWarning) {
                const warnings = [];
                if (hiddenSol.length !== words.length) {
                    warnings.push(`La Parola Nascosta ha ${hiddenSol.length} lettere ma ci sono ${words.length} parole: devono corrispondere una a una.`);
                }
                notFoundRows.forEach(i => {
                    const ch = hiddenSol[i];
                    warnings.push(ch
                        ? `Riga ${i + 1} ("${words[i]}") non contiene la lettera "${ch}".`
                        : `Riga ${i + 1} ("${words[i]}") non ha una lettera corrispondente nella Parola Nascosta.`);
                });
                prvWarning.hidden = warnings.length === 0;
                if (warnings.length > 0) prvWarning.innerHTML = '⚠️ ' + warnings.join('<br>⚠️ ');
            }

            const hiddenCol = Math.max(...hiddenPos, 0);
            const placements = words.map((text, i) => ({
                text, hiddenPos: hiddenPos[i], startX: hiddenCol - hiddenPos[i], idx: i + 1
            }));

            // Build grid data
            const gridInfo = new Map();
            placements.forEach((p, row) => {
                for (let k = 0; k < p.text.length; k++) gridInfo.set(`${p.startX + k},${row}`, p.text[k]);
            });
            const totalCols = Math.max(...placements.map(p => p.startX + p.text.length));
            const totalRows = words.length;

            // Render grid
            prvWrap.innerHTML = '<div class="prv-grid" id="prvGrid"></div>';
            const grid = document.getElementById('prvGrid');
            grid.style.gridTemplateColumns = `repeat(${totalCols}, 22px)`;
            grid.style.gridTemplateRows    = `repeat(${totalRows}, 22px)`;

            gridInfo.forEach((char, key) => {
                const [x, y] = key.split(',').map(Number);
                const isStart   = x === placements[y].startX;
                const isHidden  = x === hiddenCol;
                const isInvalid = notFoundRows.includes(y);
                const cell = document.createElement('div');
                let cls = 'prv-cell';
                if (isStart)   cls += ' prv-start';
                if (isHidden)  cls += ' prv-hidden';
                if (isInvalid) cls += ' prv-invalid';
                cell.className = cls;
                cell.style.gridColumn = x + 1;
                cell.style.gridRow    = y + 1;
                cell.textContent = char;
                if (isStart) {
                    const num = document.createElement('span');
                    num.className = 'prv-num';
                    num.textContent = placements[y].idx;
                    cell.appendChild(num);
                }
                grid.appendChild(cell);
            });
        }
        // ─────────────────────────────────────────────────────────────────────

        // ── EDIT MODE: pre-populate the editor with saved activity data ───────
        if (editData) {

        // ─────────────────────────────────────────────────────────────────────

        btnSave.addEventListener('click', async () => {
            btnSave.disabled = true;
            btnSave.textContent = 'Salvataggio...';

            const name = document.getElementById('activityName').value.trim() || 'Attività Senza Nome';
            const timerParsed        = parseInt(document.getElementById('activityTimer').value);
            const timerSecondsParsed = parseInt(document.getElementById('activityTimerSeconds').value);
            const timer        = Number.isNaN(timerParsed) ? 5 : Math.max(0, timerParsed);
            const timerSeconds = Number.isNaN(timerSecondsParsed) ? 0 : Math.min(59, Math.max(0, timerSecondsParsed));
            if (timer === 0 && timerSeconds === 0) {
                alert("Il timer non può essere 0 minuti e 0 secondi.");
                btnSave.disabled = false;
                btnSave.textContent = editId ? 'Aggiorna Attività' : 'Salva Attività';
                return;
            }
            const zones = [...document.querySelectorAll('#zoneChecks input:checked')].map(cb => cb.value);
            const difficulty = parseInt(document.getElementById('activityDifficulty').value) || null;
            if (zones.length === 0 || !difficulty) {
                alert("Seleziona almeno una zona del corpo e la difficoltà dell'attività.");
                btnSave.disabled = false;
                btnSave.textContent = editId ? 'Aggiorna Attività' : 'Salva Attività';
                return;
            }
            const rows = document.querySelectorAll('.item-row');

            const fileSystem = _fs;

            // Firestore rejects undefined values, so only copy fields that are set
            const META_KEYS = ['id', 'type', 'name', 'activityType', 'templateKey', 'date',
                               'timerMinutes', 'timerSeconds', 'zones', 'difficulty'];
            function toMeta(item) {
                if (!item || item.type !== 'activity') return item;
                const meta = {};
                META_KEYS.forEach(k => { if (item[k] !== undefined) meta[k] = item[k]; });
                return meta;
            }

            // Upsert this activity's metadata inside a folder doc, re-reading the folder
            // server-side so concurrent saves by other editors aren't overwritten.
            function upsertInFolder(fid, meta, { appendIfMissing }) {
                return runTransaction(db, async (tx) => {
                    const ref   = doc(db, 'filesystem', fid);
                    const snap  = await tx.get(ref);
                    const items = snap.exists() ? (snap.data().items || []) : [];
                    const idx   = items.findIndex(it => it.id === meta.id);
                    if (idx >= 0) items[idx] = meta;
                    else if (appendIfMissing) items.push(meta);
                    else return;
                    tx.set(ref, { items });
                });
            }

            const newActivity = {
                id: 'a_' + Date.now(),
                type: 'activity',
                name: name,
                activityType: ACTIVITY_NAMES[activityTypeKey] || activityTypeKey,
                templateKey: activityTypeKey,
                date: new Date().toLocaleString('it-IT').slice(0, 16).replace(',', ''),
                timerMinutes: timer,
                timerSeconds: timerSeconds,
                zones,
                difficulty
            };

            try {
                async function resolveImage(imgPreview) {
                    if (imgPreview?._file)      return readAndCompressImage(imgPreview._file);
                    if (imgPreview?._storedSrc) return compressBase64Image(imgPreview._storedSrc);
                    return null;
                }

                if (isRadiazione) {
                    let questionsArray = [];
                    for (const qBlock of document.querySelectorAll('.question-block')) {
                        const qText = qBlock.querySelector('.q-text').value.trim();
                        if (!qText) continue;
                        const answers = [];
                        let correctIndex = 0;
                        qBlock.querySelectorAll('.qa-row').forEach((aRow) => {
                            const text = aRow.querySelector('.qa-input').value.trim();
                            if (text) {
                                if (aRow.querySelector('.qa-correct').checked) correctIndex = answers.length;
                                answers.push(text);
                            }
                        });
                        if (answers.length < 2) continue;
                        const imageSrc = await resolveImage(qBlock.querySelector('.img-preview'));
                        questionsArray.push({ question: qText, answers, correctIndex, image: imageSrc });
                    }
                    if (questionsArray.length === 0) { alert("Devi inserire almeno una domanda con testo e almeno 2 risposte!"); return; }
                    newActivity.questions = questionsArray;

                } else if (isGuessWhat) {
                    const gwImgFileEl   = document.getElementById('gwImgFileInput');
                    const gwImgFile     = gwImgFileEl?.files?.[0];
                    const gwImgAreaEl   = document.getElementById('gwImgArea');
                    const storedGwImage = gwImgAreaEl?._storedImage || null;
                    if (!gwImgFile && !storedGwImage) { alert("Devi caricare un'immagine!"); return; }
                    const labelRows = document.querySelectorAll('.gw-label-row');
                    const gwLabels  = [];
                    for (let i = 0; i < labelRows.length; i++) {
                        const lName = labelRows[i].querySelector('.gw-name-input')?.value.trim();
                        if (!lName) continue;
                        const idx = parseInt(labelRows[i].dataset.gwIdx);
                        const pos = gwPinPositions[idx];
                        if (!pos) { alert(`L'etichetta "${lName}" non è stata posizionata sull'immagine!`); return; }
                        gwLabels.push({ name: lName, x: Math.round(pos.x * 100) / 100, y: Math.round(pos.y * 100) / 100 });
                    }
                    if (gwLabels.length === 0) { alert("Devi inserire almeno un'etichetta posizionata!"); return; }
                    newActivity.image  = gwImgFile ? await readAndCompressImage(gwImgFile) : await compressBase64Image(storedGwImage);
                    newActivity.labels = gwLabels;

                } else if (isPassaESpassa) {
                    let phrasesArray = [];
                    for (const block of document.querySelectorAll('.pps-phrase-block')) {
                        if (!block._getPhraseData) continue;
                        const { text, blanks, instruction, imgFile, storedImageSrc } = block._getPhraseData();
                        if (!text || blanks.length === 0) continue;
                        let imageSrc = null;
                        if (imgFile) imageSrc = await readAndCompressImage(imgFile);
                        else if (storedImageSrc) imageSrc = await compressBase64Image(storedImageSrc);
                        phrasesArray.push({ text, blanks, instruction, image: imageSrc });
                    }
                    if (phrasesArray.length === 0) { alert("Devi inserire almeno una frase con degli spazi vuoti selezionati!"); return; }
                    newActivity.phrases = phrasesArray;

                } else if (isTrovaIntruso) {
                    let imagesArray = [];
                    for (const row of rows) {
                        const imgPreview = row.querySelector('.img-preview');
                        const imageSrc   = await resolveImage(imgPreview);
                        if (imageSrc) {
                            imagesArray.push({ image: imageSrc, isIntruso: row.querySelector('.intruso-check').checked });
                        }
                    }
                    if (imagesArray.length < 2) { alert("Devi inserire almeno 2 immagini!"); return; }
                    newActivity.images = imagesArray;

                } else {
                    let wordsArray = [];
                    for (const row of rows) {
                        const word     = row.querySelector('.word-input').value.trim().toUpperCase();
                        const imgSrc   = await resolveImage(row.querySelector('.img-preview'));
                        if (word !== '') wordsArray.push({ word, image: imgSrc });
                    }
                    if (wordsArray.length === 0) { alert("Devi inserire almeno una parola!"); return; }
                    newActivity.words = wordsArray;
                    if (isSeConosci) {
                        const hiddenSolution = (document.getElementById('hiddenSolutionInput')?.value || '')
                            .trim().toUpperCase().replace(/\s/g, '');

                        const resetSaveBtn = () => {
                            btnSave.disabled = false;
                            btnSave.textContent = editId ? 'Aggiorna Attività' : 'Salva Attività';
                        };

                        if (hiddenSolution.length !== wordsArray.length) {
                            alert(`La Parola Nascosta ("${hiddenSolution}") ha ${hiddenSolution.length} lettere, ma ci sono ${wordsArray.length} parole. Deve avere esattamente una lettera per ogni parola.`);
                            resetSaveBtn();
                            return;
                        }

                        const lettereMancanti = [];
                        wordsArray.forEach((w, i) => {
                            const ch = hiddenSolution[i];
                            if (!w.word.includes(ch)) {
                                lettereMancanti.push(`riga ${i + 1} ("${w.word}") non contiene la lettera "${ch}"`);
                            }
                        });
                        if (lettereMancanti.length > 0) {
                            alert(`Alcune lettere della Parola Nascosta non compaiono nella parola corrispondente:\n- ${lettereMancanti.join('\n- ')}`);
                            resetSaveBtn();
                            return;
                        }

                        newActivity.hiddenSolution = hiddenSolution;
                    }
                }

                // Save or update
                if (editId) {
                    const targetFolder = fileSystem[folderId] || [];
                    const actIdx = targetFolder.findIndex(a => a.id === editId);
                    const fullActivity = {
                        ...(actIdx >= 0 ? fileSystem[folderId][actIdx] : (editData || {})),
                        id: editId,
                        type: 'activity',
                        templateKey: activityTypeKey,
                        activityType: newActivity.activityType,
                        name: newActivity.name,
                        timerMinutes: newActivity.timerMinutes,
                        timerSeconds: newActivity.timerSeconds,
                        zones: newActivity.zones,
                        difficulty: newActivity.difficulty,
                        ...(newActivity.questions  !== undefined && { questions:  newActivity.questions }),
                        ...(newActivity.image      !== undefined && { image:      newActivity.image }),
                        ...(newActivity.labels     !== undefined && { labels:     newActivity.labels }),
                        ...(newActivity.phrases    !== undefined && { phrases:    newActivity.phrases }),
                        ...(newActivity.images     !== undefined && { images:     newActivity.images }),
                        ...(newActivity.words      !== undefined && { words:      newActivity.words }),
                        ...(newActivity.hiddenSolution !== undefined && { hiddenSolution: newActivity.hiddenSolution })
                    };
                    const meta = toMeta(fullActivity);
                    const otherFolders = Object.keys(fileSystem).filter(fid =>
                        fid !== folderId && (fileSystem[fid] || []).some(a => a.id === editId));

                    await setDoc(doc(db, 'activities', editId), { ...fullActivity, folderId });
                    await Promise.all([
                        upsertInFolder(folderId, meta, { appendIfMissing: true }),
                        ...otherFolders.map(fid => upsertInFolder(fid, meta, { appendIfMissing: false }))
                    ]);
                    alert("Attività aggiornata con successo!");
                } else {
                    await setDoc(doc(db, 'activities', newActivity.id), { ...newActivity, folderId });
                    await upsertInFolder(folderId, toMeta(newActivity), { appendIfMissing: true });
                    alert("Attività salvata con successo!");
                }
                window.location.href = 'index.html';
            } catch (err) {
                console.error('Errore salvataggio:', err);
                alert('Errore durante il salvataggio: ' + (err.message || err));
            } finally {
                btnSave.disabled = false;
                btnSave.textContent = editId ? 'Aggiorna Attività' : 'Salva Attività';
            }
        });
    </script>
</body>
</html>
